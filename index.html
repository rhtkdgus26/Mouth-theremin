
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>입 테레민 악기</title>
<style>
body { font-family: Arial, sans-serif; text-align:center; background:#111; color:#fff; margin:0; }
h1 { margin-top:20px; }
#videoWrap { position:relative; display:inline-block; margin-top:10px; }
video, canvas { width:min(92vw,720px); border-radius:16px; }
canvas { position:absolute; left:0; top:0; pointer-events:none; }
#info { margin:14px auto; max-width:760px; line-height:1.6; opacity:.9; }
button { padding:14px 22px; border:none; border-radius:12px; font-size:16px; cursor:pointer; }
</style>
</head>
<body>
<h1>😮 입 테레민 (옴닉 전자음)</h1>
<p>입 크게 벌릴수록 높은 음 / 입 오므릴수록 낮은 음<br>✋ 오른손 높이 = 볼륨</p>

<button id="startBtn">카메라 + 악기 시작</button>

<div id="videoWrap">
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
</div>

<div id="info">
브라우저에서 카메라 권한을 허용하세요.<br>
입을 벌리면 음정이 연속적으로 올라가고, 손을 위로 올릴수록 소리가 커집니다.
</div>

<script type="module">
import { FaceLandmarker, HandLandmarker, FilesetResolver }
from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const startBtn = document.getElementById("startBtn");

let faceLandmarker, handLandmarker;
let audioCtx, osc1, osc2, gainNode, filter;

function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

function initAudio(){
    audioCtx = new AudioContext();

    osc1 = audioCtx.createOscillator();
    osc2 = audioCtx.createOscillator();
    gainNode = audioCtx.createGain();
    filter = audioCtx.createBiquadFilter();

    // 약간 웃긴 로봇/옴닉 느낌
    osc1.type = "sawtooth";
    osc2.type = "square";
    osc2.detune.value = 12;

    filter.type = "bandpass";
    filter.frequency.value = 900;
    filter.Q.value = 7;

    gainNode.gain.value = 0;

    osc1.connect(filter);
    osc2.connect(filter);
    filter.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    osc1.start();
    osc2.start();
}

async function initVision(){
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );

    faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions:{ modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"},
        runningMode:"VIDEO",
        numFaces:1
    });

    handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions:{ modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"},
        runningMode:"VIDEO",
        numHands:1
    });
}

async function start(){
    const stream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:"user" }, audio:false
    });
    video.srcObject = stream;

    await video.play();

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    initAudio();
    await initVision();
    requestAnimationFrame(loop);
}

function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    const time = performance.now();

    const faceResults = faceLandmarker.detectForVideo(video,time);
    const handResults = handLandmarker.detectForVideo(video,time);

    // 기본값
    let mouthOpen = 0.02;
    let volume = 0.0;

    if(faceResults.faceLandmarks.length){
        const pts = faceResults.faceLandmarks[0];

        // 입 윗입술/아랫입술
        const upper = pts[13];
        const lower = pts[14];

        mouthOpen = Math.abs(lower.y - upper.y);

        ctx.beginPath();
        ctx.arc(upper.x*canvas.width, upper.y*canvas.height, 8,0,Math.PI*2);
        ctx.arc(lower.x*canvas.width, lower.y*canvas.height, 8,0,Math.PI*2);
        ctx.strokeStyle="lime";
        ctx.stroke();
    }

    if(handResults.landmarks.length){
        const hand = handResults.landmarks[0];
        const wrist = hand[0];

        // 손 위쪽일수록 큰 볼륨
        volume = clamp(1 - wrist.y, 0, 1);

        ctx.beginPath();
        ctx.arc(wrist.x*canvas.width, wrist.y*canvas.height, 10,0,Math.PI*2);
        ctx.strokeStyle="cyan";
        ctx.stroke();
    }

    // 입 크기 -> 연속 음정
    const normalized = clamp((mouthOpen - 0.01) / 0.10, 0, 1);
    const freq = 100 + normalized * 900;

    osc1.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.03);
    osc2.frequency.setTargetAtTime(freq*1.01, audioCtx.currentTime, 0.03);

    gainNode.gain.setTargetAtTime(volume*0.3, audioCtx.currentTime, 0.04);

    requestAnimationFrame(loop);
}

startBtn.onclick = async () => {
    startBtn.disabled = true;
    try{
        await start();
    }catch(err){
        alert("카메라 권한이 필요합니다: " + err);
        startBtn.disabled = false;
    }
};
</script>
</body>
</html>
